<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c9a097" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="하루가계부" />
  <title>하루가계부</title>
  <script>
    // 화면 테마를 먼저 적용해 깜빡임 방지 (auto | light | dark)
    try {
      var t = localStorage.getItem('gagyebu:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div id="app">
    <div class="splash">불러오는 중…</div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=4"></script>
</body>
</html>
